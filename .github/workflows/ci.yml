name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: 后端测试（Maven / JDK 21）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn -B -q test

  frontend:
    name: 前端构建（vue-tsc 类型门禁 + vite build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  miniapp:
    name: 小程序类型检查
    runs-on: ubuntu-latest
    if: ${{ false }}  # miniapp 暂无独立 type-check 脚本，先禁用；补脚本后去掉本行
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: miniapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
