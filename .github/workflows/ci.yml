name: CI

# 只做 PR 门禁（测试 / lint / 类型检查）。
# master 推送由 build-release.yml 负责构建投递，避免同一提交跑两遍完整构建，
# 吃掉 GitHub 免费私有仓的 2000 分钟/月额度。
on:
  pull_request:
    branches: [master]

jobs:
  backend:
    name: 后端测试（Maven / JDK 21）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn -B -q test

  frontend:
    name: 前端门禁（eslint + vue-tsc 类型检查 + vite build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  miniapp:
    name: 小程序类型检查（vue-tsc --noEmit）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: miniapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
