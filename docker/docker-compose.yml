services:
  mysql:
    image: mysql:8.4
    container_name: jiaopei-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jiaopei_platform
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    command:
      # MySQL 8.4 已移除 --default-authentication-plugin(8.0 deprecated / 8.4 移除),
      # 改用 authentication_policy。本地开发兼容老客户端,显式走 mysql_native_password。
      - --authentication_policy=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # 挂载建库脚本:创建操作留痕日志独立库 jiaopei_log(镜像 MYSQL_DATABASE 只能建一个库)
      - ./mysql-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7.4
    container_name: jiaopei-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # 本地开发用对象存储。生产见 docker-compose.prod.yml.example 的 minio 服务。
  # 镜像来源：上游 minio/minio 已于 2025-10 停发社区版并从 Docker Hub / Quay 下架
  # （2026-02 源码仓库归档），原先固定的 RELEASE.2025-04-22 已无法拉取。
  # 改用社区维护的 Silo（Pigsty 的 MinIO 分支）：entrypoint、MINIO_* 环境变量、端口、
  # /data 卷、运行用户（root）、Web 控制台与 mc 均与上游一致，本文件其余部分不需要改。
  # 该镜像原名 pgsty/minio，已改名为 pgsty/silo（旧名停在 2026-08，只有新名继续发版）。
  # 仍钉死版本：不同 RELEASE 的桶/控制台行为有差异，别用 latest。
  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: jiaopei-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  redis_data:
  minio_data:
