services:
  mysql:
    image: mysql:8.4
    container_name: jiaopei-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jiaopei_platform
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    command:
      # MySQL 8.4 已移除 --default-authentication-plugin(8.0 deprecated / 8.4 移除),
      # 改用 authentication_policy。本地开发兼容老客户端,显式走 mysql_native_password。
      - --authentication_policy=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # 挂载建库脚本:创建操作留痕日志独立库 jiaopei_log(镜像 MYSQL_DATABASE 只能建一个库)
      - ./mysql-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7.4
    container_name: jiaopei-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # 本地开发用对象存储。生产见 docker-compose.prod.yml.example 的 minio 服务。
  # 钉死版本：MinIO 不同 RELEASE 的桶/控制台行为有差异，别用 latest。
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: jiaopei-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  redis_data:
  minio_data:
