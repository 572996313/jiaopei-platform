server:
  # 本地开发端口。生产容器由 backend/Dockerfile 的 ENV SERVER_PORT=8080 覆盖
  # （Spring Boot 环境变量优先级高于本文件），容器内固定 8080。
  port: 9080
  servlet:
    context-path: /

spring:
  application:
    name: jiaopei-platform-backend
  servlet:
    multipart:
      # 账号批量导入要收 2000 行带格式的 xlsx，默认 1MB 会直接被拒；
      # 文件模块走同一个 multipart 通道，这里给到容器硬顶，业务上限由系统参数
      # file.upload.max_size_mb 收（默认 20MB）。
      max-file-size: 50MB
      max-request-size: 52MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:jiaopei_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  flyway:
    enabled: false
    # Flyway 由多数据源配置显式管理:primaryFlyway(业务库 classpath:db/migration)
    # 与 auditFlyway(日志库 classpath:db/audit-migration),此处禁用 Boot 自动迁移避免重复执行
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

  audit-datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

cornerstone:
  security:
    data-key: ${DATA_ENCRYPT_KEY:jiaopei-dev-only-aes-key-please-change-32bytes!}
    public-paths:
      - /api/health
      - /api/system/bootstrap
      # 品牌文案要在登录页展示,必须免登录可读;返回的只是展示文案,不含任何数据
      - /api/system/branding
      - /api/auth/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
  audit-db:
    host: ${DB_AUDIT_HOST:127.0.0.1}
    port: ${DB_AUDIT_PORT:3306}
    database: ${DB_AUDIT_NAME:jiaopei_log}
    username: ${DB_AUDIT_USERNAME:root}
    password: ${DB_AUDIT_PASSWORD:1234}
  # 模块真开关（阶段二C）：false 时该模块的 Controller/Service/Mapper 一律不注册，接口 404。
  # 开关在各模块的 *ModuleConfiguration 上（@ConditionalOnProperty）。
  # 底座只存"模块码 → 开关"，不认识具体模块名（阶段五-1 回灌），新项目加自己的条目即可。
  # 依赖方向 education -> organization，关 organization 必须同时关 education。
  modules:
    enabled:
      organization: ${MODULE_ORGANIZATION_ENABLED:true}
      education: ${MODULE_EDUCATION_ENABLED:true}
  # 业务库 Flyway 迁移目录；某模块要自带脚本时在此追加其 jar 内目录。
  # 教培走的是存量路径（V1..V45 一路演进出来的 sys_ 表），**不要**追加
  # classpath:cornerstone/migration —— 那是底座给全新项目的基线（V100~V199 号段），
  # 两条路径长出同一个库，差异由 CornerstoneBaselineGuardTest 与 V45 拦着。
  flyway:
    locations:
      - classpath:db/migration
  auth:
    jwt:
      # HS256 签名密钥(至少 32 字节)。生产环境必须用环境变量 AUTH_JWT_SECRET 覆盖此开发默认值
      secret: ${AUTH_JWT_SECRET:jiaopei-dev-only-hs256-secret-change-me-32bytes!}
  # 文件存储（部署期参数）。本地开发默认落盘；生产用 FILE_STORAGE_PROVIDER=minio。
  # 上传大小上限/扩展名白名单/孤儿保留时长是运行时参数，在系统参数页维护（sys_system_config）。
  file:
    provider: ${FILE_STORAGE_PROVIDER:local}
    bucket: ${MINIO_BUCKET:jiaopei-files}
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    region: ${MINIO_REGION:us-east-1}
    local-dir: ${FILE_LOCAL_DIR:./data/files}

wx:
  miniapp:
    # 微信小程序 AppID/Secret,在 mp.weixin.qq.com 注册后获取;生产环境用环境变量注入
    appid: ${WECHAT_MINIAPP_APPID:}
    secret: ${WECHAT_MINIAPP_SECRET:}
    msg-data-format: JSON

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cornerstone
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  # 日志行固定带 TraceIdFilter 写入 MDC 的链路 ID：前端报错提示里的 traceId 可直接 grep。
  # 以前 MDC 有值但默认 pattern 不打印，响应里的 traceId 在日志里根本搜不到。
  pattern:
    level: "%5p [%X{traceId:-}]"
  file:
    # 相对进程工作目录；scripts/restart-backend.sh 从仓库根启动，落在 logs/backend.log
    name: ${LOG_FILE:logs/backend.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
