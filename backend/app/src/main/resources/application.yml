server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: jiaopei-platform-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:jiaopei_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  flyway:
    enabled: false
    # Flyway 由多数据源配置显式管理:primaryFlyway(业务库 classpath:db/migration)
    # 与 auditFlyway(日志库 classpath:db/audit-migration),此处禁用 Boot 自动迁移避免重复执行
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

  audit-datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

cornerstone:
  security:
    data-key: ${DATA_ENCRYPT_KEY:jiaopei-dev-only-aes-key-please-change-32bytes!}
    public-paths:
      - /api/health
      - /api/system/bootstrap
      - /api/auth/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
  audit-db:
    host: ${DB_AUDIT_HOST:127.0.0.1}
    port: ${DB_AUDIT_PORT:3306}
    database: ${DB_AUDIT_NAME:jiaopei_log}
    username: ${DB_AUDIT_USERNAME:root}
    password: ${DB_AUDIT_PASSWORD:1234}
  # 模块真开关（阶段二C）：false 时该模块的 Controller/Service/Mapper 一律不注册，接口 404。
  # 开关在各模块的 *ModuleConfiguration 上（@ConditionalOnProperty）。
  # 底座只存"模块码 → 开关"，不认识具体模块名（阶段五-1 回灌），新项目加自己的条目即可。
  # 依赖方向 education -> organization，关 organization 必须同时关 education。
  modules:
    enabled:
      organization: ${MODULE_ORGANIZATION_ENABLED:true}
      education: ${MODULE_EDUCATION_ENABLED:true}
  # 业务库 Flyway 迁移目录；某模块要自带脚本时在此追加其 jar 内目录。
  flyway:
    locations:
      - classpath:db/migration
  auth:
    jwt:
      # HS256 签名密钥(至少 32 字节)。生产环境必须用环境变量 AUTH_JWT_SECRET 覆盖此开发默认值
      secret: ${AUTH_JWT_SECRET:jiaopei-dev-only-hs256-secret-change-me-32bytes!}

wx:
  miniapp:
    # 微信小程序 AppID/Secret,在 mp.weixin.qq.com 注册后获取;生产环境用环境变量注入
    appid: ${WECHAT_MINIAPP_APPID:}
    secret: ${WECHAT_MINIAPP_SECRET:}
    msg-data-format: JSON

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cornerstone
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
